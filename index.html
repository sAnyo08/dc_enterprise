<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            padding: 0 24px;
        }

        h2 {
            margin-top: 30px;
        }

        model-viewer {
            width: 100%;
            height: 70vh;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .scroll-btn {
            display: block;
            width: fit-content;
            margin: 20px auto;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #0078ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }

        .scroll-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 20px;
            }

            model-viewer {
                height: 60vh;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="#model2" class="scroll-btn">
            View Model 2 ↓
        </a>

        <h2>Model 1</h2>

        <model-viewer src="new_vasai_school.glb" camera-controls min-camera-orbit="auto auto 0.1m"
            max-camera-orbit="auto auto 100m" field-of-view="45deg">
        </model-viewer>
        <p></p>
        <h2 id="model2">Model 2</h2>
        <p></p>
        <model-viewer src="withoutslide.glb" camera-controls min-camera-orbit="auto auto 0.1m"
            max-camera-orbit="auto auto 100m" field-of-view="45deg">
        </model-viewer>

    </div>

</body>

</html>
