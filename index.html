<!DOCTYPE html>
<html>

<head>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>
</head>

<body>
    <h2>Model 1</h2>
    <model-viewer src="viva_school.glb" camera-controls min-camera-orbit="auto auto 0.1m"
        max-camera-orbit="auto auto 100m" field-of-view="45deg" style="width:100%;height:100vh;">
    </model-viewer>

    <h2>Model 2</h2>
    <model-viewer src="withoutslide.glb" camera-controls min-camera-orbit="auto auto 0.1m"
        max-camera-orbit="auto auto 100m" field-of-view="45deg" style="width:100%;height:100vh;">
    </model-viewer>
</body>

</html>
